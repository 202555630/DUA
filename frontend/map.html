<!DOCTYPE html>
<html>
<head>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=dd88b9ca50995197b849e4ed9948edd1"></script>
  <style>
    /* 정보창(말풍선) 꾸미기 */
    .info-window {
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      min-width: 150px;
    }
    .info-title {
      font-weight: bold;
      font-size: 14px;
      color: #0369a1;
      margin-bottom: 5px;
    }
    .info-category {
      color: #64748b;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="map" style="width:100%; height:700px;"></div>

  <script>
    var mapContainer = document.getElementById('map');
    var mapOption = {
        center: new kakao.maps.LatLng(35.1587, 129.1604), // 광안리
        level: 5 
    };
    var map = new kakao.maps.Map(mapContainer, mapOption);

    fetch('http://localhost:8080/api/locations')
      .then(response => response.json())
      .then(data => {
        data.locations.forEach(location => {

            var lat = location.latitude;
            var lng = location.longitude;
            var name = location.name;
            var category = location.category;

            if (!lat || !lng) return;

            var markerPosition = new kakao.maps.LatLng(
                parseFloat(lat),
                parseFloat(lng)
            );

            var marker = new kakao.maps.Marker({
                position: markerPosition
            });

            marker.setMap(map);

            var iwContent = `
                <div class="info-window">
                    <div class="info-title">${name}</div>
                    <div class="info-category">${category || ''}</div>
                </div>
            `;

            var infowindow = new kakao.maps.InfoWindow({
                content: iwContent
            });

            kakao.maps.event.addListener(marker, 'mouseover', function () {
                infowindow.open(map, marker);
            });

            kakao.maps.event.addListener(marker, 'mouseout', function () {
                infowindow.close();
            });

        });
    })
    .catch(error => console.error('백엔드 데이터 가져오기 실패:', error));

    const courseLines = [];

    const courseColors = [
      "#ef4444",
      "#22c55e",
      "#3b82f6"
    ];

    window.addEventListener("message",(event)=>{

      const data = event.data;

      if(data.type==="drawCourses"){
          drawCourses(data.courses);
      }

      if(data.type==="highlight"){
          highlightCourse(data.index);
      }

    });

    function drawCourses(courses){
      console.log(courses);

      courseLines.forEach(line=>{
          line.setMap(null);
      });

      courseLines.length=0;

      courses.forEach((course,courseIndex)=>{
        console.log("course", courseIndex, course);

        let path=[];

        course.forEach((spot,index)=>{
            const position=new kakao.maps.LatLng(
                parseFloat(spot.latitude),
                parseFloat(spot.longitude)
            );

            path.push(position);
        });

        const line=new kakao.maps.Polyline({
            path:path,
            strokeWeight:5,
            strokeColor:courseColors[courseIndex],
            strokeOpacity:0.8,
            strokeStyle:"solid"
        });

        line.setMap(map);
        courseLines.push(line);
      });

      highlightCourse(0);
    }

    function highlightCourse(index){
      // 선 색 변경
      courseLines.forEach((line, i)=>{
        if(i===index){
          line.setOptions({
            strokeColor: courseColors[i],
            strokeOpacity: 0.9,
            strokeWeight: 6
          });

        } else {
            line.setOptions({
              strokeColor: "#bdbdbd",
              strokeOpacity: 0.5,
              strokeWeight: 4
          });
        }
      });
    }
    
  </script>
</body>
</html>
