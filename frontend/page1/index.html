
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport - 부산 지하철 여행 검색</title>
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
   
</head>
<body>

    <div class="container">
        
        <div class="section-box">
            <div class="title-text">DUA</div>
            <div class="title-small-text">어디로든 떠나고 싶은 순간, 부산이 답합니다.</div>
        </div>

        <div class="section-box">
            <div class="region-select-wrapper">
        <select class="region-select" id="region-select">
        <option value="" disabled selected>지역 선택</option>
        <option value="수영구">광안리</option>
        <option value="해운대구">해운대</option>
        <option value="서면">서면</option> 
    </select>
            </div>
        </div>

        <div class="section-box">

        <div class="section-box">
    <div class="section-title">동행 유형 선택</div>

    <div class="options-wrapper" id="companion-options">
        <div
            class="option-card"
            data-value="가족"
            onclick="selectOption(this)"
        >
            <div class="option-text">가족</div>
        </div>

        <div
            class="option-card"
            data-value="연인"
            onclick="selectOption(this)"
        >
            <div class="option-text">연인</div>
        </div>

        <div
            class="option-card"
            data-value="친구"
            onclick="selectOption(this)"
        >
            <div class="option-text">친구</div>
        </div>
    </div>
</div>

    <div class="section-box">
    <div class="section-title">날씨 선택</div>

    <div class="options-wrapper" id="weather-options">
        <div
            class="option-card"
            data-value="맑음"
            onclick="selectOption(this)"
        >
            <div class="option-text">맑음</div>
        </div>

        <div
            class="option-card"
            data-value="비"
            onclick="selectOption(this)"
        >
            <div class="option-text">비</div>
        </div>

        <div
            class="option-card"
            data-value="폭염"
            onclick="selectOption(this)"
        >
            <div class="option-text">폭염</div>
        </div>
    </div>
</div>

        <div class="search-container">
            <button class="search-btn" type="button" onclick="goToPage2()">
             검색
              <div class="search-icon-box">🔍</div>
            </button>
        </div>

    </div>

    <script src="./main.js"></script>
</body>
</html>
