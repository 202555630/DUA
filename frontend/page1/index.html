
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport - 부산 지하철 여행 검색</title>
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
   
</head>
<body>

    <div class="container">
        
        <div class="section-box">
            <div class="title-text">DUA</div>
            <div class="title-small-text">어디로든 떠나고 싶은 순간, 부산이 답합니다.</div>
        </div>

        <div class="section-box">
            <div class="region-select-wrapper">
        <select class="region-select" id="region-select">
        <option value="" disabled selected>지역 선택</option>
        <option value="광안리">광안리</option>
        <option value="해운대">해운대</option>
        <option value="서면">서면</option>
    </select>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">동행 유형 선택</div>
            <div class="options-wrapper">
                <div class="option-card" onclick="selectOption(this)">
                    <div class="option-text">가족</div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <div class="option-text">연인</div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <div class="option-text">친구</div>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">날씨 선택</div>
            <div class="options-wrapper">
                <div class="option-card" onclick="selectOption(this)">
                    <div class="option-text">맑음</div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <div class="option-text">비</div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <div class="option-text">폭염</div>
                </div>
            </div>
        </div>

        <div class="search-container">
            <button class="search-btn" type="button" onclick="goToPage2()">
             검색
              <div class="search-icon-box">🔍</div>
            </button>
        </div>

    </div>
    <script>
    function selectOption(element) {
        // 클릭한 카드와 같은 줄에 있는 모든 카드 찾기
        const siblings =
            element.parentElement.querySelectorAll(".option-card");

        // 기존 선택 상태 제거
        siblings.forEach((card) => {
            card.classList.remove("selected");
        });

        // 클릭한 카드에 선택 상태 추가
        element.classList.add("selected");
    }

    function goToPage2() {
        // 지역 선택 메뉴 가져오기
        const regionSelect =
            document.getElementById("region-select");

        // 선택된 지역 이름
        const selectedRegion = regionSelect.value;

        // 지역을 선택하지 않은 경우
        if (!selectedRegion) {
            alert("지역을 선택해주세요.");
            return;
        }

        // 선택한 지역을 주소에 포함해 2페이지로 이동
        window.location.href =
            `../page2/index.html?region=${encodeURIComponent(selectedRegion)}`;
    }
</script>

</body>
</html>
